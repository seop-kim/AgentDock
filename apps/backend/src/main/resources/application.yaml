server:
  port: ${PORT:8080}
  tomcat:
    threads:
      # 화면 요청(SSE 포함)과 에이전트 실행 API 가 같이 쓴다 — 기본값 그대로 두되 최소 여유는 확보한다.
      max: 200
      min-spare: 20

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/AGENT_DOCK}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # 기본 10 은 빠듯하다 — 에이전트 4개가 동시에 돌면서 SSE·화면 요청까지 커넥션을 쓰면 요청이 커넥션을 기다린다.
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# 실행 로그: 콘솔과 파일(logs/agentdock.log)에 함께 남긴다. 라이브러리 잡음은 줄이고 우리 코드만 INFO 로 본다.
logging:
  level:
    com.agent.dock: INFO
  file:
    name: logs/agentdock.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7

# 위임(실행 트리) 상한. 값을 바꾸면 코드 수정 없이 조정된다.
agentdock:
  delegation:
    max-depth: 3            # 루트에서 몇 단계까지 내려갈 수 있는지
    max-executions: 20      # 트리 하나(명령 하나)가 만들 수 있는 실행 수
    max-steps: 8           # 한 실행이 판단을 반복할 수 있는 횟수
    max-targets: 4          # 한 번에 맡길 수 있는 대상 수
    max-concurrent: 4       # 동시에 도는 CLI 수
    max-cost-usd: 5         # 트리 하나의 예산 상한(달러)
